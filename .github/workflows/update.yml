name: Update Etsy Printify Database

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      # ---------------------------------------------------
      # RESTORE DATABASE
      # ---------------------------------------------------

      - name: Restore compressed database
        run: |
          if [ -f data/etsy_printify.db.gz ]; then
            gunzip -f data/etsy_printify.db.gz
          fi

      # ---------------------------------------------------
      # CHECK ETSY CREDENTIALS
      # ---------------------------------------------------

      - name: Check Etsy credentials
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_API_SHARED_SECRET: ${{ secrets.ETSY_API_SHARED_SECRET }}
          ETSY_ACCESS_TOKEN: ${{ secrets.ETSY_ACCESS_TOKEN }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        run: |
          python - <<'PY2'
          import os
          import re

          key = os.getenv("ETSY_API_KEY", "")
          secret = os.getenv("ETSY_API_SHARED_SECRET", "")
          access = os.getenv("ETSY_ACCESS_TOKEN", "")
          refresh = os.getenv("ETSY_REFRESH_TOKEN", "")

          print("ETSY_API_KEY present:", bool(key))
          print("ETSY_API_SHARED_SECRET present:", bool(secret))
          print("ETSY_ACCESS_TOKEN present:", bool(access))
          print("ETSY_REFRESH_TOKEN present:", bool(refresh))

          access_match = re.fullmatch(r"[0-9]+\..+", access)
          refresh_match = re.fullmatch(r"[0-9]+\..+", refresh)

          print(
              "ETSY_ACCESS_TOKEN format valid:",
              bool(access_match),
          )

          print(
              "ETSY_REFRESH_TOKEN format valid:",
              bool(refresh_match),
          )

          if access_match:
              print(
                  "Access token user ID:",
                  access.split(".", 1)[0],
              )

          if refresh_match:
              print(
                  "Refresh token user ID:",
                  refresh.split(".", 1)[0],
              )
          PY2

      # ---------------------------------------------------
      # RAW ETSY INVENTORY DIAGNOSTIC
      # ---------------------------------------------------

      - name: Raw Etsy inventory diagnostic
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_API_SHARED_SECRET: ${{ secrets.ETSY_API_SHARED_SECRET }}
          ETSY_ACCESS_TOKEN: ${{ secrets.ETSY_ACCESS_TOKEN }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          from src.etsy_api import EtsyApiClient

          LISTING_ID = 4557429557

          client = EtsyApiClient.from_environment()

          inventory = client.get_listing_inventory(LISTING_ID)

          print("=" * 80)
          print("RAW ETSY INVENTORY DIAGNOSTIC")
          print("=" * 80)
          print()
          print("LISTING ID:", LISTING_ID)

          products = inventory.get("products", [])

          print("PRODUCT COUNT:", len(products))
          print()

          for number, product in enumerate(products, 1):

              sku = str(
                  product.get("sku") or ""
              ).strip()

              print("-" * 80)
              print("PRODUCT:", number)
              print("SKU:", sku)

              # Etsy's inventory API stores the variation/property
              # information here. Print the complete property values
              # for this product so we can see exactly which variant
              # Etsy associates with the SKU.
              property_values = (
                  product.get("property_values") or []
              )

              print("PROPERTY VALUES:")

              if not property_values:
                  print("  NONE")
              else:
                  for prop in property_values:
                      print(
                          " ",
                          prop,
                      )

              offerings = (
                  product.get("offerings") or []
              )

              print("OFFERINGS:")

              if not offerings:
                  print("  NONE")
              else:
                  for offering in offerings:

                      offering_id = offering.get(
                          "offering_id"
                      )

                      is_enabled = offering.get(
                          "is_enabled"
                      )

                      is_deleted = offering.get(
                          "is_deleted"
                      )

                      price = offering.get(
                          "price"
                      )

                      print(
                          "  OFFERING ID:",
                          offering_id,
                      )

                      print(
                          "  ENABLED:",
                          is_enabled,
                      )

                      print(
                          "  DELETED:",
                          is_deleted,
                      )

                      print(
                          "  PRICE:",
                          price,
                      )

              print()

          print("=" * 80)
          print("END RAW ETSY INVENTORY DIAGNOSTIC")
          print("=" * 80)
          PY

      # ---------------------------------------------------
      # ETSY VARIANT PRICE DIAGNOSTIC
      # ---------------------------------------------------

      - name: Etsy variant price diagnostic
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_API_SHARED_SECRET: ${{ secrets.ETSY_API_SHARED_SECRET }}
          ETSY_ACCESS_TOKEN: ${{ secrets.ETSY_ACCESS_TOKEN }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import pandas as pd

          from src.main import (
              read_etsy_csv,
              build_etsy_tables,
              ETSY_CSV,
          )
          from src.etsy_api import EtsyApiClient

          print("=" * 70)
          print("ETSY VARIANT PRICE DIAGNOSTIC")
          print("=" * 70)

          csv_df = read_etsy_csv(ETSY_CSV)
          listings, variants = build_etsy_tables(csv_df)

          print()
          print("CSV LISTINGS:", len(listings))
          print("CSV VARIANT ROWS:", len(variants))

          client = EtsyApiClient.from_environment()
          api_rows = client.get_listing_inventory_rows()

          api_df = pd.DataFrame(api_rows)

          if api_df.empty:
              print()
              print("ERROR: Etsy API returned no inventory rows.")
              raise SystemExit(1)

          api_df = api_df[
              [
                  "etsy_api_listing_id",
                  "etsy_api_title",
                  "etsy_api_sku",
                  "etsy_api_price",
                  "etsy_api_variation_1_name",
                  "etsy_api_variation_1_value",
                  "etsy_api_variation_2_name",
                  "etsy_api_variation_2_value",
                  "etsy_api_variation_label",
              ]
          ].copy()

          def normalize_sku(value):
              return (
                  str(value or "")
                  .strip()
                  .upper()
                  .replace(" ", "")
                  .replace("-", "")
                  .replace("_", "")
              )

          api_df["normalized_sku"] = (
              api_df["etsy_api_sku"].map(normalize_sku)
          )

          variants["normalized_sku"] = (
              variants["etsy_sku"].map(normalize_sku)
          )

          merged = variants.merge(
              api_df[
                  [
                      "etsy_api_listing_id",
                      "etsy_api_title",
                      "etsy_api_sku",
                      "etsy_api_price",
                      "normalized_sku",
                  ]
              ],
              on="normalized_sku",
              how="left",
              suffixes=("_csv", "_api"),
          )

          listing_groups = []

          for source_row, group in merged.groupby(
              "etsy_source_row",
              dropna=False,
          ):
              prices = pd.to_numeric(
                  group["etsy_api_price"],
                  errors="coerce",
              ).dropna()

              unique_prices = sorted(
                  set(
                      round(float(p), 2)
                      for p in prices
                  )
              )

              if len(unique_prices) <= 1:
                  continue

              title = str(
                  csv_df.iloc[int(source_row) - 2]["TITLE"]
              ).strip()

              listing_groups.append(
                  {
                      "csv_row": int(source_row),
                      "title": title,
                      "unique_api_prices": unique_prices,
                      "variant_count": len(group),
                  }
              )

          print()
          print("=" * 70)
          print("SUMMARY")
          print("=" * 70)

          print(
              "LISTINGS WITH MULTIPLE API PRICES:",
              len(listing_groups),
          )

          print()
          print("=" * 70)
          print("LISTINGS WITH MULTIPLE ETSY VARIANT PRICES")
          print("=" * 70)

          for item in listing_groups:
              print()
              print("CSV ROW:", item["csv_row"])
              print("TITLE:", item["title"])
              print("API PRICES:", item["unique_api_prices"])
              print("VARIANT ROWS:", item["variant_count"])

              group = merged[
                  merged["etsy_source_row"]
                  == item["csv_row"]
              ].copy()

              display_columns = [
                  "etsy_sku",
                  "etsy_variation_label",
                  "etsy_api_variation_label",
                  "etsy_api_listing_id",
                  "etsy_api_sku",
                  "etsy_api_price",
              ]

              print(
                  group[
                      [
                          c
                          for c in display_columns
                          if c in group.columns
                      ]
                  ].to_string(index=False)
              )

          print()
          print("=" * 70)
          print("END ETSY VARIANT PRICE DIAGNOSTIC")
          print("=" * 70)
          PY

      # ---------------------------------------------------
      # RUN SYNC
      # ---------------------------------------------------

      - name: Run sync
        env:
          PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
          PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_API_SHARED_SECRET: ${{ secrets.ETSY_API_SHARED_SECRET }}
          ETSY_ACCESS_TOKEN: ${{ secrets.ETSY_ACCESS_TOKEN }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        run: python -m src.main

      # ---------------------------------------------------
      # FINAL COMPARISON PRICE DIAGNOSTIC
      # ---------------------------------------------------

      - name: Final comparison price diagnostic
        run: |
          python - <<'PY'
          import pandas as pd

          path = "output/etsy_printify_comparison.csv"

          print("=" * 70)
          print("FINAL COMPARISON PRICE DIAGNOSTIC")
          print("=" * 70)

          df = pd.read_csv(path)

          print()
          print("COMPARISON ROWS:", len(df))

          mask = df["etsy_title"].astype(str).str.contains(
              "Personalized Thanksgiving Table Runner",
              case=False,
              na=False,
          )

          result = df.loc[
              mask,
              [
                  c
                  for c in [
                      "etsy_listing_id",
                      "etsy_title",
                      "etsy_sku",
                      "etsy_variation_label",
                      "etsy_price",
                      "etsy_price_numeric",
                      "printify_sku",
                      "printify_variant_title",
                      "printify_cost_numeric",
                      "printify_shipping_cost",
                      "estimated_net_profit",
                      "estimated_net_margin_pct",
                      "match_status",
                  ]
                  if c in df.columns
              ],
          ]

          print()
          print("THANKSGIVING RUNNER FINAL COMPARISON ROWS:")
          print()

          if result.empty:
              print("NO MATCHING THANKSGIVING RUNNER ROWS FOUND")
          else:
              print(result.to_string(index=False))

          print()
          print("=" * 70)
          print("END FINAL COMPARISON PRICE DIAGNOSTIC")
          print("=" * 70)
          PY

      # ---------------------------------------------------
      # SEND DAILY SUMMARY EMAIL
      # ---------------------------------------------------

      - name: Send daily summary email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
        run: |
          EMAIL_BODY=$(cat output/sync_summary.txt)

          PAYLOAD=$(jq -n \
            --arg from "$RESEND_FROM_EMAIL" \
            --arg to1 "robo78640@gmail.com" \
            --arg to2 "zuritaconsejos@hotmail.com" \
            --arg subject "Daily Etsy ↔ Printify Sync Summary" \
            --arg text "$EMAIL_BODY" \
            '{
              from: $from,
              to: [$to1, $to2],
              subject: $subject,
              text: $text
            }')

          curl -sS -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

      # ---------------------------------------------------
      # COMPRESS DATABASE
      # ---------------------------------------------------

      - name: Compress database
        run: |
          if [ -f data/etsy_printify.db ]; then
            gzip -f data/etsy_printify.db
          fi

      # ---------------------------------------------------
      # COMMIT REPORTS
      # ---------------------------------------------------

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A data output

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Etsy Printify database and reports"
            git push
          fi
