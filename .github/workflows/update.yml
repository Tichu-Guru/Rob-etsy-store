name: Update Etsy Printify Database

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Restore compressed database
        run: |
          if [ -f data/etsy_printify.db.gz ]; then
            gunzip -f data/etsy_printify.db.gz
          fi

      - name: Check Etsy credentials
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_API_SHARED_SECRET: ${{ secrets.ETSY_API_SHARED_SECRET }}
          ETSY_ACCESS_TOKEN: ${{ secrets.ETSY_ACCESS_TOKEN }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        run: |
          python - <<'PY2'
          import os
          import re

          key = os.getenv("ETSY_API_KEY", "")
          secret = os.getenv("ETSY_API_SHARED_SECRET", "")
          access = os.getenv("ETSY_ACCESS_TOKEN", "")
          refresh = os.getenv("ETSY_REFRESH_TOKEN", "")

          print("ETSY_API_KEY present:", bool(key))
          print("ETSY_API_SHARED_SECRET present:", bool(secret))
          print("ETSY_ACCESS_TOKEN present:", bool(access))
          print("ETSY_REFRESH_TOKEN present:", bool(refresh))

          access_match = re.fullmatch(r"[0-9]+\..+", access)
          refresh_match = re.fullmatch(r"[0-9]+\..+", refresh)

          print("ETSY_ACCESS_TOKEN format valid:", bool(access_match))
          print("ETSY_REFRESH_TOKEN format valid:", bool(refresh_match))

          if access_match:
              print("Access token user ID:", access.split(".", 1)[0])

          if refresh_match:
              print("Refresh token user ID:", refresh.split(".", 1)[0])
          PY2
      - name: Etsy API listing diagnostic
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_API_SHARED_SECRET: ${{ secrets.ETSY_API_SHARED_SECRET }}
          ETSY_ACCESS_TOKEN: ${{ secrets.ETSY_ACCESS_TOKEN }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          from src.etsy_api import EtsyApiClient

          client = EtsyApiClient.from_environment()

          print("=== ETSY API LISTING DIAGNOSTIC ===")

          shop_id = client.get_shop_id()
          print("SHOP ID:", shop_id)

          listings = client.get_all_listings(shop_id)

          print("API LISTING RECORDS:", len(listings))

          listing_ids = [
              str(x.get("listing_id", "")).strip()
              for x in listings
              if x.get("listing_id")
          ]

          print("API LISTING IDs:", len(listing_ids))
          print("UNIQUE API LISTING IDs:", len(set(listing_ids)))
          print()

          print("LISTINGS BY STATE:")
          for state in (
              "active",
              "inactive",
              "sold_out",
              "draft",
              "expired",
          ):
              offset = 0
              count = 0

              while True:
                  data = client.request(
                      "GET",
                      f"/shops/{shop_id}/listings",
                      params={
                          "state": state,
                          "limit": 100,
                          "offset": offset,
                      },
                  )

                  results = data.get("results", [])
                  count += len(results)

                  if len(results) < 100:
                      break

                  offset += len(results)

              print(f"  {state}: {count}")

          print()
          print("=== API LISTINGS ===")

          seen = set()

          for listing in sorted(
              listings,
              key=lambda x: str(x.get("title", "")).lower(),
          ):
              listing_id = str(
                  listing.get("listing_id", "")
              ).strip()

              if not listing_id:
                  continue

              if listing_id in seen:
                  continue

              seen.add(listing_id)

              title = str(
                  listing.get("title", "")
              ).strip()

              state = str(
                  listing.get("state", "")
              ).strip()

              print(
                  f"{listing_id} | {state} | {title}"
              )

          print()
          print("=== END DIAGNOSTIC ===")
          PY
      - name: Etsy CSV to API Listing Diagnostic
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_API_SHARED_SECRET: ${{ secrets.ETSY_API_SHARED_SECRET }}
          ETSY_ACCESS_TOKEN: ${{ secrets.ETSY_ACCESS_TOKEN }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import pandas as pd

          from src.main import read_etsy_csv, ETSY_CSV
          from src.etsy_api import EtsyApiClient

          print("=" * 70)
          print("ETSY CSV → API LISTING DIAGNOSTIC")
          print("=" * 70)

          # -------------------------------------------------
          # CSV
          # -------------------------------------------------

          csv_df = read_etsy_csv(ETSY_CSV)

          print()
          print("CSV LISTINGS:", len(csv_df))
          print("CSV UNIQUE TITLES:", csv_df["TITLE"].nunique())

          # -------------------------------------------------
          # FULL ETSY API LISTINGS
          # -------------------------------------------------

          client = EtsyApiClient.from_environment()
          shop_id = client.get_shop_id()
          api_listings = client.get_all_listings(shop_id)

          print("API LISTINGS:", len(api_listings))

          # -------------------------------------------------
          # Build API title map
          # -------------------------------------------------

          api_records = []

          for listing in api_listings:
              listing_id = listing.get("listing_id")

              if not listing_id:
                  continue

              api_records.append(
                  {
                      "api_listing_id": str(listing_id),
                      "api_title": str(
                          listing.get("title", "")
                      ).strip(),
                      "api_state": str(
                          listing.get("state", "")
                      ).strip(),
                  }
              )

          api_df = pd.DataFrame(api_records)

          print(
              "API UNIQUE LISTING IDS:",
              api_df["api_listing_id"].nunique()
          )

          # -------------------------------------------------
          # Map title → API listings
          # -------------------------------------------------

          api_by_title = (
              api_df
              .groupby("api_title", dropna=False)
              ["api_listing_id"]
              .agg(list)
              .to_dict()
          )

          state_by_id = dict(
              zip(
                  api_df["api_listing_id"],
                  api_df["api_state"],
              )
          )

          # -------------------------------------------------
          # Compare every CSV row
          # -------------------------------------------------

          results = []

          for idx, row in csv_df.iterrows():

              title = str(
                  row["TITLE"]
              ).strip()

              matches = api_by_title.get(
                  title,
                  []
              )

              results.append(
                  {
                      "csv_row": idx + 2,
                      "csv_title": title,
                      "api_match_count": len(matches),
                      "api_listing_ids": ",".join(matches),
                      "api_states": ",".join(
                          state_by_id.get(
                              listing_id,
                              ""
                          )
                          for listing_id in matches
                      ),
                  }
              )

          result_df = pd.DataFrame(results)

          # -------------------------------------------------
          # Summary
          # -------------------------------------------------

          exact_one = (
              result_df["api_match_count"] == 1
          ).sum()

          multiple = (
              result_df["api_match_count"] > 1
          ).sum()

          none = (
              result_df["api_match_count"] == 0
          ).sum()

          print()
          print("=" * 70)
          print("RESULTS")
          print("=" * 70)

          print(
              "CSV rows with EXACTLY ONE API title match:",
              exact_one
          )

          print(
              "CSV rows with MULTIPLE API title matches:",
              multiple
          )

          print(
              "CSV rows with NO API title match:",
              none
          )

          # -------------------------------------------------
          # Multiple matches
          # -------------------------------------------------

          print()
          print("=" * 70)
          print("MULTIPLE API MATCHES")
          print("=" * 70)

          multi = result_df[
              result_df["api_match_count"] > 1
          ]

          if multi.empty:
              print("NONE")
          else:
              for _, row in multi.iterrows():
                  print()
                  print("CSV ROW:", row["csv_row"])
                  print("TITLE:", row["csv_title"])
                  print(
                      "API MATCHES:",
                      row["api_listing_ids"]
                  )
                  print(
                      "API STATES:",
                      row["api_states"]
                  )

          # -------------------------------------------------
          # No matches
          # -------------------------------------------------

          print()
          print("=" * 70)
          print("NO API MATCH")
          print("=" * 70)

          no_match = result_df[
              result_df["api_match_count"] == 0
          ]

          if no_match.empty:
              print("NONE")
          else:
              for _, row in no_match.iterrows():
                  print()
                  print("CSV ROW:", row["csv_row"])
                  print("TITLE:", row["csv_title"])

          # -------------------------------------------------
          # Save complete diagnostic
          # -------------------------------------------------

          output_path = (
              "output/csv_api_listing_mapping.csv"
          )

          result_df.to_csv(
              output_path,
              index=False,
          )

          print()
          print("=" * 70)
          print(
              "FULL DIAGNOSTIC:",
              output_path
          )
          print("=" * 70)
          PY

      - name: Run sync
        env:
          PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
          PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_API_SHARED_SECRET: ${{ secrets.ETSY_API_SHARED_SECRET }}
          ETSY_ACCESS_TOKEN: ${{ secrets.ETSY_ACCESS_TOKEN }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        run: python -m src.main

      - name: Send daily summary email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
        run: |
          EMAIL_BODY=$(cat output/sync_summary.txt)

          PAYLOAD=$(jq -n \
            --arg from "$RESEND_FROM_EMAIL" \
            --arg to1 "robo78640@gmail.com" \
            --arg to2 "zuritaconsejos@hotmail.com" \
            --arg subject "Daily Etsy ↔ Printify Sync Summary" \
            --arg text "$EMAIL_BODY" \
            '{
              from: $from,
              to: [$to1, $to2],
              subject: $subject,
              text: $text
            }')

          curl -sS -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

      - name: Compress database
        run: |
          if [ -f data/etsy_printify.db ]; then
            gzip -f data/etsy_printify.db
          fi

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A data output

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Etsy Printify data"
            git push
          fi
