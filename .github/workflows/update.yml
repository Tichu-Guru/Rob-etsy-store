name: Update Etsy Printify Database

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt
      # ---------------------------------------------------
      # RESTORE DATABASE
      # ---------------------------------------------------

      - name: Restore compressed database
        run: |
          if [ -f data/etsy_printify.db.gz ]; then
            gunzip -f data/etsy_printify.db.gz
          fi

      # ---------------------------------------------------
      # CHECK ETSY CREDENTIALS
      # ---------------------------------------------------
      - name: Check Etsy credentials
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_API_SHARED_SECRET: ${{ secrets.ETSY_API_SHARED_SECRET }}
          ETSY_ACCESS_TOKEN: ${{ secrets.ETSY_ACCESS_TOKEN }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        run: |
          python - <<'PY2'
          import os
          import re
          key = os.getenv("ETSY_API_KEY", "")
          secret = os.getenv("ETSY_API_SHARED_SECRET", "")
          access = os.getenv("ETSY_ACCESS_TOKEN", "")
          refresh = os.getenv("ETSY_REFRESH_TOKEN", "")

          print("ETSY_API_KEY present:", bool(key))
          print("ETSY_API_SHARED_SECRET present:", bool(secret))
          print("ETSY_ACCESS_TOKEN present:", bool(access))
          print("ETSY_REFRESH_TOKEN present:", bool(refresh))
          access_match = re.fullmatch(r"[0-9]+\..+", access)
          refresh_match = re.fullmatch(r"[0-9]+\..+", refresh)

          print(
              "ETSY_ACCESS_TOKEN format valid:",
              bool(access_match),
          )

          print(
              "ETSY_REFRESH_TOKEN format valid:",
              bool(refresh_match),
          )

          if access_match:
              print(
                  "Access token user ID:",
                  access.split(".", 1)[0],
              )
          if refresh_match:
              print(
                  "Refresh token user ID:",
                  refresh.split(".", 1)[0],
              )
          PY2

      # ---------------------------------------------------
      # RAW ETSY INVENTORY DIAGNOSTIC
      # ---------------------------------------------------
      - name: Raw Etsy inventory diagnostic
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_API_SHARED_SECRET: ${{ secrets.ETSY_API_SHARED_SECRET }}
          ETSY_ACCESS_TOKEN: ${{ secrets.ETSY_ACCESS_TOKEN }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          from src.etsy_api import EtsyApiClient

          LISTING_ID = 4557429557

          client = EtsyApiClient.from_environment()
          inventory = client.get_listing_inventory(LISTING_ID)

          print("=" * 80)
          print("RAW ETSY INVENTORY DIAGNOSTIC")
          print("=" * 80)
          print()
          print("LISTING ID:", LISTING_ID)

          products = inventory.get("products", [])

          print("PRODUCT COUNT:", len(products))
          print()

          for number, product in enumerate(products, 1):

              sku = str(
                  product.get("sku") or ""
              ).strip()
              print("-" * 80)
              print("PRODUCT:", number)
              print("SKU:", sku)

              property_values = (
                  product.get("property_values") or []
              )

              print("PROPERTY VALUES:")
              if not property_values:
                  print("  NONE")
              else:
                  for prop in property_values:
                      print(
                          " ",
                          prop,
                      )

              offerings = (
                  product.get("offerings") or []
              )

              print("OFFERINGS:")
              if not offerings:
                  print("  NONE")
              else:
                  for offering in offerings:

                      offering_id = offering.get(
                          "offering_id"
                      )

                      is_enabled = offering.get(
                          "is_enabled"
                      )

                      is_deleted = offering.get(
                          "is_deleted"
                      )
                      price = offering.get(
                          "price"
                      )

                      print(
                          "  OFFERING ID:",
                          offering_id,
                      )

                      print(
                          "  ENABLED:",
                          is_enabled,
                      )

                      print(
                          "  DELETED:",
                          is_deleted,
                      )
                      print(
                          "  PRICE:",
                          price,
                      )

              print()

          print("=" * 80)
          print("END RAW ETSY INVENTORY DIAGNOSTIC")
          print("=" * 80)
          PY

      # ---------------------------------------------------
      # ETSY VARIANT PRICE DIAGNOSTIC
      # ---------------------------------------------------
      - name: Etsy variant price diagnostic
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_API_SHARED_SECRET: ${{ secrets.ETSY_API_SHARED_SECRET }}
          ETSY_ACCESS_TOKEN: ${{ secrets.ETSY_ACCESS_TOKEN }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import pandas as pd
          from src.main import (
              read_etsy_csv,
              build_etsy_tables,
              ETSY_CSV,
          )
          from src.etsy_api import EtsyApiClient

          print("=" * 70)
          print("ETSY VARIANT PRICE DIAGNOSTIC")
          print("=" * 70)

          csv_df = read_etsy_csv(ETSY_CSV)
          listings, variants = build_etsy_tables(csv_df)

          print()
          print("CSV LISTINGS:", len(listings))
          print("CSV VARIANT ROWS:", len(variants))
          client = EtsyApiClient.from_environment()
          api_rows = client.get_listing_inventory_rows()

          api_df = pd.DataFrame(api_rows)

          if api_df.empty:
              print()
              print("ERROR: Etsy API returned no inventory rows.")
              raise SystemExit(1)

          api_df = api_df[
              [
                  "etsy_api_listing_id",
                  "etsy_api_title",
                  "etsy_api_sku",
                  "etsy_api_price",
                  "etsy_api_variation_1_name",
                  "etsy_api_variation_1_value",
                  "etsy_api_variation_2_name",
                  "etsy_api_variation_2_value",
                  "etsy_api_variation_label",
              ]
          ].copy()

          def normalize_sku(value):
              return (
                  str(value or "")
                  .strip()
                  .upper()
                  .replace(" ", "")
                  .replace("-", "")
                  .replace("_", "")
              )

          api_df["normalized_sku"] = (
              api_df["etsy_api_sku"].map(normalize_sku)
          )

          variants["normalized_sku"] = (
              variants["etsy_sku"].map(normalize_sku)
          )

          merged = variants.merge(
              api_df[
                  [
                      "etsy_api_listing_id",
                      "etsy_api_title",
                      "etsy_api_sku",
                      "etsy_api_price",
                      "etsy_api_variation_1_name",
                      "etsy_api_variation_1_value",
                      "etsy_api_variation_2_name",
                      "etsy_api_variation_2_value",
                      "etsy_api_variation_label",
                      "normalized_sku",
                  ]
              ],
              on="normalized_sku",
              how="left",
              suffixes=("_csv", "_api"),
          )

          listing_groups = []
          for source_row, group in merged.groupby(
              "etsy_source_row",
              dropna=False,
          ):
              prices = pd.to_numeric(
                  group["etsy_api_price"],
                  errors="coerce",
              ).dropna()

              unique_prices = sorted(
                  set(
                      round(float(p), 2)
                      for p in prices
                  )
              )
              if len(unique_prices) <= 1:
                  continue

              title = str(
                  csv_df.iloc[int(source_row) - 2]["TITLE"]
              ).strip()

              listing_groups.append(
                  {
                      "csv_row": int(source_row),
                      "title": title,
                      "unique_api_prices": unique_prices,
                      "variant_count": len(group),
                  }
              )

          print()
          print("=" * 70)
          print("SUMMARY")
          print("=" * 70)

          print(
              "LISTINGS WITH MULTIPLE API PRICES:",
              len(listing_groups),
          )

          print()
          print("=" * 70)
          print("LISTINGS WITH MULTIPLE ETSY VARIANT PRICES")
          print("=" * 70)

          for item in listing_groups:
              print()
              print("CSV ROW:", item["csv_row"])
              print("TITLE:", item["title"])
              print("API PRICES:", item["unique_api_prices"])
              print("VARIANT ROWS:", item["variant_count"])

              group = merged[
                  merged["etsy_source_row"]
                  == item["csv_row"]
              ].copy()

              display_columns = [
                  "etsy_sku",
                  "etsy_variation_label",
                  "etsy_api_variation_label",
                  "etsy_api_listing_id",
                  "etsy_api_sku",
                  "etsy_api_price",
              ]

              print(
                  group[
                      [
                          c
                          for c in display_columns
                          if c in group.columns
                      ]
                  ].to_string(index=False)
              )

          print()
          print("=" * 70)
          print("END ETSY VARIANT PRICE DIAGNOSTIC")
          print("=" * 70)
          PY

      # ---------------------------------------------------
      # RAW PRINTIFY SKU DIAGNOSTIC
      # ---------------------------------------------------

      - name: Raw Printify SKU diagnostic
        env:
          PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
          PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
        run: |
          python - <<'PY'
          from src.printify import PrintifyClient

          TARGET_SKU = "21687814772705489731"

          client = PrintifyClient()
          shop_id = client.get_shop_id()

          print("=" * 100)
          print("RAW PRINTIFY SKU DIAGNOSTIC")
          print("=" * 100)
          print("TARGET SKU:", TARGET_SKU)
          print()

          found = False

          for product in client.get_all_products(shop_id):
              for variant in product.get("variants", []) or []:
                  sku = str(variant.get("sku") or "").strip()

                  if sku != TARGET_SKU:
                      continue

                  found = True

                  print("PRODUCT ID:", product.get("id"))
                  print("PRODUCT TITLE:", product.get("title"))
                  print("VARIANT ID:", variant.get("id"))
                  print("VARIANT TITLE:", variant.get("title"))
                  print("RAW SKU:", sku)
                  print("RAW COST:", variant.get("cost"))
                  print("RAW PRICE:", variant.get("price"))
                  print()

          if not found:
              print("TARGET SKU NOT FOUND IN PRINTIFY API")

          print("=" * 100)
          print("END RAW PRINTIFY SKU DIAGNOSTIC")
          print("=" * 100)
          PY

      # ---------------------------------------------------
      # LIVE ETSY LISTING UNIVERSE DIAGNOSTIC
      # ---------------------------------------------------
      - name: Live Etsy listing universe diagnostic
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_API_SHARED_SECRET: ${{ secrets.ETSY_API_SHARED_SECRET }}
          ETSY_ACCESS_TOKEN: ${{ secrets.ETSY_ACCESS_TOKEN }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          from collections import Counter
          import pandas as pd

          from src.etsy_api import EtsyApiClient
          from src.etsy import read_etsy_csv
          from src.config import ETSY_CSV


          def normalize_title(value):
              return " ".join(
                  str(value or "")
                  .strip()
                  .lower()
                  .split()
              )


          print()
          print("=" * 120)
          print("LIVE ETSY LISTING UNIVERSE DIAGNOSTIC")
          print("=" * 120)

          # ------------------------------------------------
          # LOAD CURRENT CSV
          # ------------------------------------------------

          csv_df = read_etsy_csv(ETSY_CSV)

          csv_titles = {
              normalize_title(title)
              for title in csv_df["TITLE"].tolist()
              if normalize_title(title)
          }

          print()
          print("CSV PHYSICAL ROW COUNT:", len(csv_df))
          print(
              "CSV UNIQUE NON-BLANK TITLES:",
              len(csv_titles),
          )

          # ------------------------------------------------
          # LOAD ALL ETSY LISTINGS
          # ------------------------------------------------

          client = EtsyApiClient.from_environment()
          shop_id = client.get_shop_id()

          listings = client.get_all_listings(
              shop_id
          )

          print()
          print(
              "TOTAL API LISTINGS ALL STATES:",
              len(listings),
          )

          state_counts = Counter(
              str(
                  listing.get("state", "")
              ).strip().lower()
              or "MISSING"
              for listing in listings
          )

          print()
          print("API LISTINGS BY STATE:")

          for state, count in sorted(
              state_counts.items()
          ):
              print(
                  f"  {state}: {count}"
              )

          # ------------------------------------------------
          # REMOVE DRAFTS
          # ------------------------------------------------

          non_draft = [
              listing
              for listing in listings
              if str(
                  listing.get("state", "")
              ).strip().lower() != "draft"
          ]

          non_draft_titles = {
              normalize_title(
                  listing.get("title", "")
              )
              for listing in non_draft
              if normalize_title(
                  listing.get("title", "")
              )
          }

          print()
          print(
              "NON-DRAFT API LISTINGS:",
              len(non_draft),
          )

          print(
              "UNIQUE NON-DRAFT API TITLES:",
              len(non_draft_titles),
          )

          # ------------------------------------------------
          # API LISTINGS MISSING FROM CSV
          # ------------------------------------------------

          api_missing_from_csv = [
              listing
              for listing in non_draft
              if normalize_title(
                  listing.get("title", "")
              )
              not in csv_titles
          ]

          print()
          print("=" * 120)
          print(
              "NON-DRAFT ETSY API LISTINGS "
              "MISSING FROM CSV"
          )
          print("=" * 120)

          print(
              "COUNT:",
              len(api_missing_from_csv),
          )

          if not api_missing_from_csv:
              print("NONE")
          else:
              for listing in sorted(
                  api_missing_from_csv,
                  key=lambda item: (
                      str(
                          item.get(
                              "state",
                              "",
                          )
                      ),
                      str(
                          item.get(
                              "title",
                              "",
                          )
                      ),
                  ),
              ):
                  print(
                      f"{listing.get('listing_id')} | "
                      f"{listing.get('state')} | "
                      f"{listing.get('title')}"
                  )

          # ------------------------------------------------
          # CSV LISTINGS MISSING FROM NON-DRAFT API
          # ------------------------------------------------

          api_title_to_listing = {}

          for listing in non_draft:
              title_key = normalize_title(
                  listing.get("title", "")
              )

              if title_key:
                  api_title_to_listing.setdefault(
                      title_key,
                      []
                  ).append(listing)

          csv_missing_from_api = [
              title
              for title in sorted(csv_titles)
              if title not in api_title_to_listing
          ]

          print()
          print("=" * 120)
          print(
              "CSV TITLES MISSING FROM "
              "NON-DRAFT ETSY API"
          )
          print("=" * 120)

          print(
              "COUNT:",
              len(csv_missing_from_api),
          )

          if not csv_missing_from_api:
              print("NONE")
          else:
              for title in csv_missing_from_api:
                  print(title)

          # ------------------------------------------------
          # CURRENT / ACTIVE-STYLE BREAKDOWN
          # ------------------------------------------------

          current_states = {
              "active",
              "edit",
          }

          current_listings = [
              listing
              for listing in listings
              if str(
                  listing.get("state", "")
              ).strip().lower()
              in current_states
          ]

          print()
          print("=" * 120)
          print("CURRENT ETSY LISTINGS")
          print("=" * 120)

          print(
              "ACTIVE + EDIT COUNT:",
              len(current_listings),
          )

          print()
          print(
              "STATE | LISTING ID | TITLE"
          )

          for listing in sorted(
              current_listings,
              key=lambda item: str(
                  item.get("listing_id", "")
              ),
          ):
              print(
                  f"{listing.get('state')} | "
                  f"{listing.get('listing_id')} | "
                  f"{listing.get('title')}"
              )

          print()
          print("=" * 120)
          print(
              "END LIVE ETSY LISTING UNIVERSE "
              "DIAGNOSTIC"
          )
          print("=" * 120)
          PY

      # ---------------------------------------------------
      # ACTIVE ETSY LISTINGS MISSING FROM CSV DIAGNOSTIC
      # ---------------------------------------------------
      - name: Active Etsy listings missing from CSV diagnostic
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_API_SHARED_SECRET: ${{ secrets.ETSY_API_SHARED_SECRET }}
          ETSY_ACCESS_TOKEN: ${{ secrets.ETSY_ACCESS_TOKEN }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        run: |
          python - <<'PY2'
          import pandas as pd

          from src.etsy_api import EtsyApiClient
          from src.etsy import read_etsy_csv
          from src.config import ETSY_CSV


          def normalize_sku(value):
              return (
                  str(value or "")
                  .strip()
                  .lower()
                  .replace(" ", "")
                  .replace("-", "")
                  .replace("_", "")
              )


          def normalize_title(value):
              return " ".join(
                  str(value or "")
                  .strip()
                  .lower()
                  .split()
              )


          print()
          print("=" * 120)
          print("ACTIVE ETSY LISTINGS MISSING FROM CSV DIAGNOSTIC")
          print("=" * 120)

          # -------------------------------------------------
          # LOAD CSV
          # -------------------------------------------------

          csv_df = read_etsy_csv(ETSY_CSV)

          csv_titles = set(
              csv_df["TITLE"]
              .fillna("")
              .map(normalize_title)
          )

          csv_skus = set()

          if "SKU" in csv_df.columns:
              for value in csv_df["SKU"].fillna(""):
                  for sku in str(value).split(","):
                      normalized = normalize_sku(sku)

                      if normalized:
                          csv_skus.add(normalized)

          print()
          print(f"CSV PHYSICAL LISTING ROWS: {len(csv_df)}")
          print(f"CSV UNIQUE TITLES: {len(csv_titles)}")
          print(f"CSV UNIQUE SKUS: {len(csv_skus)}")

          # -------------------------------------------------
          # LOAD LIVE ETSY
          # -------------------------------------------------

          client = EtsyApiClient.from_environment()

          shop_id = client.get_shop_id()

          all_listings = client.get_all_listings(
              shop_id
          )

          active_listings = [
              listing
              for listing in all_listings
              if str(
                  listing.get("state", "")
              ).strip().lower() == "active"
          ]

          print(
              f"LIVE ACTIVE ETSY LISTINGS: "
              f"{len(active_listings)}"
          )

          # -------------------------------------------------
          # GET LIVE INVENTORY ROWS
          # -------------------------------------------------

          api_rows = client.get_listing_inventory_rows()

          api_df = pd.DataFrame(api_rows)

          if api_df.empty:
              raise SystemExit(
                  "ERROR: Etsy API returned no inventory rows."
              )

          api_df["etsy_api_listing_id"] = (
              api_df["etsy_api_listing_id"]
              .astype(str)
          )

          active_ids = {
              str(
                  listing.get("listing_id")
              )
              for listing in active_listings
          }

          active_api = api_df[
              api_df["etsy_api_listing_id"]
              .isin(active_ids)
          ].copy()

          # -------------------------------------------------
          # EXAMINE EACH ACTIVE LISTING
          # -------------------------------------------------

          missing = []

          for listing in active_listings:

              listing_id = str(
                  listing.get("listing_id")
              )

              title = str(
                  listing.get("title", "")
              ).strip()

              title_key = normalize_title(title)

              inventory_rows = active_api[
                  active_api["etsy_api_listing_id"]
                  == listing_id
              ]

              live_skus = set(
                  normalize_sku(sku)
                  for sku in inventory_rows[
                      "etsy_api_sku"
                  ].fillna("")
                  if normalize_sku(sku)
              )

              sku_match = bool(
                  live_skus & csv_skus
              )

              title_match = (
                  title_key in csv_titles
              )

              if not sku_match and not title_match:

                  missing.append(
                      {
                          "listing_id":
                              listing_id,

                          "title":
                              title,

                          "live_sku_count":
                              len(live_skus),

                          "live_skus":
                              ", ".join(
                                  sorted(live_skus)
                              )
                              if live_skus
                              else "(NO SKU)",
                      }
                  )

          # -------------------------------------------------
          # OUTPUT
          # -------------------------------------------------

          print()
          print("=" * 120)
          print(
              "ACTIVE ETSY LISTINGS WITH NO CSV SKU "
              "MATCH AND NO CSV TITLE MATCH"
          )
          print("=" * 120)

          print(
              f"COUNT: {len(missing)}"
          )

          if not missing:
              print()
              print(
                  "NONE FOUND."
              )
          else:
              print()

              result = pd.DataFrame(
                  missing
              )

              print(
                  result.to_string(
                      index=False
                  )
              )

          print()
          print("=" * 120)
          print("END ACTIVE ETSY LISTINGS MISSING FROM CSV DIAGNOSTIC")
          print("=" * 120)
          PY2

      # ---------------------------------------------------
      # RUN SYNC
      # ---------------------------------------------------
      - name: Run sync
        env:
          PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
          PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_API_SHARED_SECRET: ${{ secrets.ETSY_API_SHARED_SECRET }}
          ETSY_ACCESS_TOKEN: ${{ secrets.ETSY_ACCESS_TOKEN }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        run: python -m src.main

      # ---------------------------------------------------
      # NUTCRACKER COMPARISON OUTPUT DIAGNOSTIC
      # ---------------------------------------------------
      # ---------------------------------------------------
      # CERAMIC CHRISTMAS ORNAMENT MATCH DIAGNOSTIC
      # ---------------------------------------------------
      # ---------------------------------------------------
      # SYNC SUMMARY REPORT DIAGNOSTIC
      # ---------------------------------------------------
      - name: Sync summary report diagnostic
        run: |
          echo "============================================================"
          echo "SYNC SUMMARY REPORT"
          echo "============================================================"
          cat output/sync_summary.txt
          echo "============================================================"
          echo "END SYNC SUMMARY REPORT"
          echo "============================================================"

      - name: Ceramic Christmas ornament match diagnostic
        run: |
          python - <<'PY2'
          import pandas as pd

          path = "output/etsy_printify_comparison.csv"

          print()
          print("=" * 120)
          print("CERAMIC CHRISTMAS ORNAMENT MATCH DIAGNOSTIC")
          print("=" * 120)

          df = pd.read_csv(path)

          mask = (
              df["etsy_title"]
              .astype(str)
              .str.contains(
                  "Personalized Ceramic Christmas Ornament",
                  case=False,
                  na=False,
              )
          )

          result = df.loc[mask].copy()

          print(
              "ROWS:",
              len(result),
          )

          if result.empty:
              print("NO MATCHING LISTING FOUND")
          else:
              columns = [
                  c
                  for c in [
                      "etsy_listing_id",
                      "etsy_title",
                      "etsy_sku",
                      "etsy_variation_label",
                      "etsy_price",
                      "printify_product_id",
                      "printify_sku",
                      "printify_variant_title",
                      "printify_price",
                      "printify_cost_numeric",
                      "printify_shipping_cost",
                      "match_status",
                  ]
                  if c in result.columns
              ]

              print(
                  result[
                      columns
                  ].to_string(
                      index=False
                  )
              )

          print()
          print("=" * 120)
          print(
              "END CERAMIC CHRISTMAS ORNAMENT MATCH DIAGNOSTIC"
          )
          print("=" * 120)
          PY2


      - name: Nutcracker comparison output diagnostic
        run: |
          python - <<'PY'
          import pandas as pd

          path = "output/etsy_printify_comparison.csv"
          df = pd.read_csv(path)

          result = df[
              df["etsy_title"].astype(str).str.contains(
                  "Personalized Pet Photo Nutcracker Ornament",
                  case=False,
                  na=False,
              )
          ]

          print("=" * 100)
