name: Update Etsy Printify Database

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      # ---------------------------------------------------
      # RESTORE DATABASE
      # ---------------------------------------------------

      - name: Restore compressed database
        run: |
          if [ -f data/etsy_printify.db.gz ]; then
            gunzip -f data/etsy_printify.db.gz
          fi

      # ---------------------------------------------------
      # CHECK ETSY CREDENTIALS
      # ---------------------------------------------------

      - name: Check Etsy credentials
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_API_SHARED_SECRET: ${{ secrets.ETSY_API_SHARED_SECRET }}
          ETSY_ACCESS_TOKEN: ${{ secrets.ETSY_ACCESS_TOKEN }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        run: |
          python - <<'PY2'
          import os
          import re

          key = os.getenv("ETSY_API_KEY", "")
          secret = os.getenv("ETSY_API_SHARED_SECRET", "")
          access = os.getenv("ETSY_ACCESS_TOKEN", "")
          refresh = os.getenv("ETSY_REFRESH_TOKEN", "")

          print("ETSY_API_KEY present:", bool(key))
          print("ETSY_API_SHARED_SECRET present:", bool(secret))
          print("ETSY_ACCESS_TOKEN present:", bool(access))
          print("ETSY_REFRESH_TOKEN present:", bool(refresh))

          access_match = re.fullmatch(r"[0-9]+\..+", access)
          refresh_match = re.fullmatch(r"[0-9]+\..+", refresh)

          print(
              "ETSY_ACCESS_TOKEN format valid:",
              bool(access_match),
          )

          print(
              "ETSY_REFRESH_TOKEN format valid:",
              bool(refresh_match),
          )

          if access_match:
              print(
                  "Access token user ID:",
                  access.split(".", 1)[0],
              )

          if refresh_match:
              print(
                  "Refresh token user ID:",
                  refresh.split(".", 1)[0],
              )
          PY2

      # ---------------------------------------------------
      # ETSY API LISTING DIAGNOSTIC
      # ---------------------------------------------------

      - name: Etsy API listing diagnostic
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_API_SHARED_SECRET: ${{ secrets.ETSY_API_SHARED_SECRET }}
          ETSY_ACCESS_TOKEN: ${{ secrets.ETSY_ACCESS_TOKEN }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import pandas as pd

          from src.main import (
              read_etsy_csv,
              ETSY_CSV,
          )
          from src.etsy_api import EtsyApiClient

          print("=" * 70)
          print("ETSY API LISTING DIAGNOSTIC")
          print("=" * 70)
          print()

          # -------------------------------------------------
          # READ CSV
          # -------------------------------------------------

          df = read_etsy_csv(ETSY_CSV)

          print("CSV LISTINGS:", len(df))
          print()

          # -------------------------------------------------
          # GET ETSY API INVENTORY
          # -------------------------------------------------

          client = EtsyApiClient.from_environment()

          rows = client.get_listing_inventory_rows()

          api = pd.DataFrame(rows)

          if api.empty:
              print("API INVENTORY ROWS: 0")
              print()
              print("NO API INVENTORY DATA WAS RETURNED.")
              raise SystemExit(0)

          api = (
              api[
                  [
                      "etsy_api_listing_id",
                      "etsy_api_title",
                  ]
              ]
              .drop_duplicates()
          )

          api_listing_count = (
              api["etsy_api_listing_id"]
              .nunique()
          )

          print(
              "API LISTINGS WITH INVENTORY/SKU DATA:",
              api_listing_count,
          )
          print()

          # -------------------------------------------------
          # GROUP API LISTINGS BY TITLE
          # -------------------------------------------------

          api_by_title = (
              api.groupby("etsy_api_title")
              ["etsy_api_listing_id"]
              .agg(list)
              .to_dict()
          )

          # -------------------------------------------------
          # MATCH CSV TITLES TO API TITLES
          # -------------------------------------------------

          exact_one = []
          multiple = []
          none = []

          for idx, row in df.iterrows():

              csv_row = idx + 2
              title = str(
                  row["TITLE"]
              ).strip()

              matches = api_by_title.get(
                  title,
                  [],
              )

              result = {
                  "csv_row": csv_row,
                  "title": title,
                  "api_listing_ids": matches,
              }

              if len(matches) == 1:
                  exact_one.append(result)

              elif len(matches) > 1:
                  multiple.append(result)

              else:
                  none.append(result)

          # -------------------------------------------------
          # SUMMARY
          # -------------------------------------------------

          print(
              "CSV rows with EXACTLY ONE API title match:",
              len(exact_one),
          )

          print(
              "CSV rows with MULTIPLE API title matches:",
              len(multiple),
          )

          print(
              "CSV rows with NO API title match:",
              len(none),
          )

          print()

          # -------------------------------------------------
          # EXACTLY ONE MATCH
          # -------------------------------------------------

          print("=" * 70)
          print("CSV ROWS WITH EXACTLY ONE API TITLE MATCH")
          print("=" * 70)

          for item in exact_one:
              print()
              print(
                  "CSV ROW:",
                  item["csv_row"],
              )
              print(
                  "TITLE:",
                  item["title"],
              )
              print(
                  "API LISTING ID:",
                  item["api_listing_ids"][0],
              )

          # -------------------------------------------------
          # MULTIPLE MATCHES
          # -------------------------------------------------

          print()
          print("=" * 70)
          print("CSV ROWS WITH MULTIPLE API TITLE MATCHES")
          print("=" * 70)

          for item in multiple:
              print()
              print(
                  "CSV ROW:",
                  item["csv_row"],
              )
              print(
                  "TITLE:",
                  item["title"],
              )
              print(
                  "API LISTING IDS:",
                  ", ".join(
                      item["api_listing_ids"]
                  ),
              )

          # -------------------------------------------------
          # NO MATCH
          # -------------------------------------------------

          print()
          print("=" * 70)
          print("CSV ROWS WITH NO API TITLE MATCH")
          print("=" * 70)

          for item in none:
              print()
              print(
                  "CSV ROW:",
                  item["csv_row"],
              )
              print(
                  "TITLE:",
                  item["title"],
              )

          print()
          print("=" * 70)
          print("END ETSY API LISTING DIAGNOSTIC")
          print("=" * 70)
          PY

      # ---------------------------------------------------
      # RUN SYNC
      # ---------------------------------------------------

      - name: Run sync
        env:
          PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
          PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_API_SHARED_SECRET: ${{ secrets.ETSY_API_SHARED_SECRET }}
          ETSY_ACCESS_TOKEN: ${{ secrets.ETSY_ACCESS_TOKEN }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        run: python -m src.main

      # ---------------------------------------------------
      # SEND DAILY SUMMARY EMAIL
      # ---------------------------------------------------

      - name: Send daily summary email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
        run: |
          EMAIL_BODY=$(cat output/sync_summary.txt)

          PAYLOAD=$(jq -n \
            --arg from "$RESEND_FROM_EMAIL" \
            --arg to1 "robo78640@gmail.com" \
            --arg to2 "zuritaconsejos@hotmail.com" \
            --arg subject "Daily Etsy ↔ Printify Sync Summary" \
            --arg text "$EMAIL_BODY" \
            '{
              from: $from,
              to: [$to1, $to2],
              subject: $subject,
              text: $text
            }')

          curl -sS -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

      # ---------------------------------------------------
      # COMPRESS DATABASE
      # ---------------------------------------------------

      - name: Compress database
        run: |
          if [ -f data/etsy_printify.db ]; then
            gzip -f data/etsy_printify.db
          fi

      # ---------------------------------------------------
      # COMMIT REPORTS
      # ---------------------------------------------------

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A data output

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Etsy Printify database and reports"
            git push
          fi
