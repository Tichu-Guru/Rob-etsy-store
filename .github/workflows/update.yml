name: Update Etsy Printify Database

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Restore compressed database
        run: |
          if [ -f data/etsy_printify.db.gz ]; then
            gunzip -f data/etsy_printify.db.gz
          fi

      - name: Check Etsy credentials
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_API_SHARED_SECRET: ${{ secrets.ETSY_API_SHARED_SECRET }}
          ETSY_ACCESS_TOKEN: ${{ secrets.ETSY_ACCESS_TOKEN }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        run: |
          python - <<'PY2'
          import os
          import re

          key = os.getenv("ETSY_API_KEY", "")
          secret = os.getenv("ETSY_API_SHARED_SECRET", "")
          access = os.getenv("ETSY_ACCESS_TOKEN", "")
          refresh = os.getenv("ETSY_REFRESH_TOKEN", "")

          print("ETSY_API_KEY present:", bool(key))
          print("ETSY_API_SHARED_SECRET present:", bool(secret))
          print("ETSY_ACCESS_TOKEN present:", bool(access))
          print("ETSY_REFRESH_TOKEN present:", bool(refresh))

          access_match = re.fullmatch(r"[0-9]+\..+", access)
          refresh_match = re.fullmatch(r"[0-9]+\..+", refresh)

          print("ETSY_ACCESS_TOKEN format valid:", bool(access_match))
          print("ETSY_REFRESH_TOKEN format valid:", bool(refresh_match))

          if access_match:
              print("Access token user ID:", access.split(".", 1)[0])

          if refresh_match:
              print("Refresh token user ID:", refresh.split(".", 1)[0])
          PY2

      - name: Run sync
        env:
          PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
          PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_API_SHARED_SECRET: ${{ secrets.ETSY_API_SHARED_SECRET }}
          ETSY_ACCESS_TOKEN: ${{ secrets.ETSY_ACCESS_TOKEN }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        run: python -m src.main

      - name: Send daily summary email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
        run: |
          EMAIL_BODY=$(cat output/sync_summary.txt)

          PAYLOAD=$(jq -n \
            --arg from "$RESEND_FROM_EMAIL" \
            --arg to1 "robo78640@gmail.com" \
            --arg to2 "zuritaconsejos@hotmail.com" \
            --arg subject "Daily Etsy ↔ Printify Sync Summary" \
            --arg text "$EMAIL_BODY" \
            '{
              from: $from,
              to: [$to1, $to2],
              subject: $subject,
              text: $text
            }')

          curl -sS -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

      - name: Compress database
        run: |
          if [ -f data/etsy_printify.db ]; then
            gzip -f data/etsy_printify.db
          fi

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A data output

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Etsy Printify data"
            git push
          fi
